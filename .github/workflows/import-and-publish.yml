name: Import Yoshiwara sources and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-and-publish.yml'
      - 'README.md'
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original PreTeXt sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          for name in core-math elem-alg int-algebra mfg trig; do
            echo "::group::Import $name"
            if [ -f "sources/$name/UPSTREAM-COMMIT.txt" ]; then
              echo "Preserving existing imported source for $name"
              echo "::endgroup::"
              continue
            fi
            git clone --depth 1 "https://github.com/byoshiwara/$name.git" "/tmp/yoshiwara-$name"
            mkdir -p "sources/$name"
            rsync -a --exclude='.git' --exclude='output/' --exclude='published/' --exclude='generated/' "/tmp/yoshiwara-$name/" "sources/$name/"
            printf '%s\n' "https://github.com/byoshiwara/$name" > "sources/$name/UPSTREAM-URL.txt"
            git -C "/tmp/yoshiwara-$name" rev-parse HEAD > "sources/$name/UPSTREAM-COMMIT.txt"
            echo "::endgroup::"
          done
          # ORCCA is one PreTeXt source collection containing three algebra parts.
          # Preserve its source and attribution; do not include generated artefacts.
          if [ -f "sources/orcca/UPSTREAM-COMMIT.txt" ]; then
            echo "Preserving existing ORCCA source import"
          else
            echo "::group::Import ORCCA source (source-only)"
            git clone --depth 1 --branch edition "https://github.com/PCCMathSAC/orcca.git" /tmp/orcca-upstream
            mkdir -p sources/orcca
            rsync -a --exclude='.git' --exclude='output/' --exclude='orcca3ed-build/' --exclude='published/' /tmp/orcca-upstream/ sources/orcca/
            printf '%s\n' "https://github.com/PCCMathSAC/orcca" > sources/orcca/UPSTREAM-URL.txt
            git -C /tmp/orcca-upstream rev-parse HEAD > sources/orcca/UPSTREAM-COMMIT.txt
            echo "::endgroup::"
          fi
          # Applied Discrete Structures by Alan Doerr and Kenneth Levasseur.
          # Preserve the original PreTeXt source for teacher reference only.
          if [ -f "sources/ads/UPSTREAM-COMMIT.txt" ]; then
            echo "Preserving existing Applied Discrete Structures source import"
          else
            echo "::group::Import Applied Discrete Structures"
            git clone --depth 1 --branch master "https://github.com/klevasseur/ads.git" /tmp/ads-upstream
            mkdir -p sources/ads
            rsync -a --exclude='.git' --exclude='output/' --exclude='published/' /tmp/ads-upstream/ sources/ads/
            printf '%s\n' "https://github.com/klevasseur/ads" > sources/ads/UPSTREAM-URL.txt
            git -C /tmp/ads-upstream rev-parse HEAD > sources/ads/UPSTREAM-COMMIT.txt
            echo "::endgroup::"
          fi
      - name: Commit imported source without overwriting repository history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          if ! git diff --cached --quiet; then
            git commit -m "Import Yoshiwara PreTeXt source repositories [skip ci]"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PreTeXt
        run: python -m pip install pretext
      - name: Correct legacy LaTeX text escapes in the temporary build checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          # Fix only missing percent escapes inside simple LaTeX \text{...}
          # This leaves the original imported Git repository files unchanged.
          pattern = re.compile(r'\\text\{([^{}]*)\}')
          for source in ('core-math', 'int-algebra'):
              changed_files = 0
              replacements = 0
              for path in (Path('sources') / source).rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in ('.ptx', '.xml'):
                      continue
                  original = path.read_text(encoding='utf-8')
                  def repair(match):
                      global replacements
                      content, count = re.subn(r'(?<!\\)%', r'\\%', match.group(1))
                      replacements += count
                      return r'\text{' + content + '}'
                  repaired = pattern.sub(repair, original)
                  if repaired != original:
                      path.write_text(repaired, encoding='utf-8')
                      changed_files += 1
              print(f'{source}: escaped {replacements} bare percent characters in {changed_files} temporary build files')
          PY
      - name: Build each source book
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p site
          : > site/build-status.txt
          touch site/.nojekyll
          for name in core-math elem-alg int-algebra mfg trig ads; do
            echo "::group::Build $name"
            if [ "$name" = "core-math" ]; then
              # The upstream filename has an uppercase S; Linux XIncludes are case-sensitive.
              test -f sources/core-math/source/Sec-5-5.ptx
              sed -i 's|href="./sec-5-5.ptx"|href="./Sec-5-5.ptx"|' sources/core-math/source/ch5.ptx
              echo "Restored complete upstream Section 5.5, including its cross-reference targets."
            fi
            if ( cd "sources/$name" && pretext build web --no-generate ); then
              result=0
            else
              result=$?
            fi
            if [ "$result" -eq 0 ]; then
              candidate="sources/$name/output/web"
              if [ ! -d "$candidate" ]; then candidate="sources/$name/output/html"; fi
              if [ -d "$candidate" ]; then
                mkdir -p "site/$name"
                cp -a "$candidate/." "site/$name/"
                echo "$name: HTML built (diagram asset generation deferred)" >> site/build-status.txt
              else
                echo "$name: build succeeded but output location not found" >> site/build-status.txt
              fi
            else
              echo "$name: build failed (exit $result)" >> site/build-status.txt
            fi
            echo "::endgroup::"
          done
      - name: Create the unified collection home page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          titles = [
            ('core-math','Number','Core Mathematics'),
            ('elem-alg','Algebra','Elementary Algebra'),
            ('int-algebra','Advanced Algebra','Intermediate Algebra'),
            ('mfg','Functions and Sequences','Modeling, Functions, and Graphs'),
            ('trig','Trigonometry','Trigonometry'),
            ('orcca','Algebra reference','ORCCA source (three parts; build not enabled)'),
            ('ads','Discrete Mathematics reference','Applied Discrete Structures — Doerr and Levasseur'),
          ]
          items = []
          for slug, subject, title in titles:
            d=Path('site')/slug
            pages=sorted(d.glob('*.html')) if d.exists() else []
            target='index.html' if (d/'index.html').exists() else (pages[0].name if pages else '')
            if target:
              items.append(f'<li><a href="{slug}/{target}"><strong>{html.escape(subject)}</strong><span>{html.escape(title)}</span></a></li>')
            else:
              items.append(f'<li class="pending"><strong>{html.escape(subject)}</strong><span>Source imported; HTML build pending</span></li>')
          content='''<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>School Mathematics</title>
          <style>body{font:18px/1.6 system-ui,sans-serif;max-width:950px;margin:4rem auto;padding:0 1.3rem;background:#fcfcfd;color:#19283d}h1{font-size:clamp(2.2rem,5vw,3.8rem)}p{max-width:65ch}ul{list-style:none;padding:0;display:grid;gap:1rem}li a,li.pending{display:block;padding:1.2rem 1.5rem;border:1px solid #ccd5df;border-radius:12px;text-decoration:none;color:inherit;background:white}li a:hover{border-color:#3468ac;background:#f0f6ff}li span{display:block;color:#576679;font-size:.89rem}footer{font-size:.85rem;margin-top:3rem;color:#576679}</style>
          <main><h1>PreTeXt Source Library</h1><p>This is the <strong>teacher-facing reference collection</strong>, not a textbook to assign in full. The curated Irish school maths book remains separate at <a href="https://ronandownes.github.io/book/">Ronan's School Mathematics Book</a>. Nothing in this library is automatically inserted into that book.</p><h2>Source books</h2><ul>'''+''.join(items)+'''</ul><h2>Other editions and references</h2><ul><li><a href="https://yoshiwarabooks.org/mfg-no-webwork/chap2.html"><strong>Modeling, Functions, and Graphs — no WeBWorK edition</strong><span>Alternative presentation of the already imported MFG book</span></a></li><li><a href="https://icsatkcc.github.io/Discrete-Math-for-Computer-Science/section1_2-basic_Set_Operations.html"><strong>Discrete Mathematics for Computer Science — Sets</strong><span>L. J. Miller · external published PreTeXt; editable source not verified</span></a></li><li><a href="https://spot.pcc.edu/math/orcca/ed3/html/part-linear-equations-and-lines.html"><strong>ORCCA Part I</strong><span>3rd edition · linear equations and lines</span></a></li><li><a href="https://spot.pcc.edu/math/orcca/ed2/html/part-preparation-for-stem.html"><strong>ORCCA Part II</strong><span>2nd edition · polynomials, radicals and quadratic equations</span></a></li><li><a href="https://spot.pcc.edu/math/orcca/ed2/html/part-preparation-for-college-algebra.html"><strong>ORCCA Part III</strong><span>2nd edition · factoring, functions, rational expressions</span></a></li><li><a href="https://discrete.openmathbooks.org/dmoi4.html"><strong>Discrete Mathematics: An Open Introduction</strong><span>Oscar Levin · external reference</span></a></li><li><a href="https://yoshiwarabooks.org/mfg-ww/"><strong>MFG — WeBWorK edition</strong><span>Alternative published edition</span></a></li><li><a href="https://yoshiwarabooks.org/int-algebra-ww/"><strong>Intermediate Algebra — WeBWorK edition</strong><span>Alternative published edition</span></a></li></ul><p><a href="https://github.com/ronandownes/pretext/blob/main/SOURCE-LIBRARY.md">Full source catalogue and licence notes</a></p><footer>Original authors retain copyright. Review each source licence and attribution before reuse. No source is merged into the student book merely by being catalogued here.</footer></main></html>'''
          Path('site/index.html').write_text(content,encoding='utf-8')
          PY
      - name: Publish website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: false
      - name: Verify publication contains textbooks
        shell: bash
        run: |
          echo "=== Individual PreTeXt build outcomes ==="
          cat site/build-status.txt
          number=$(find site -mindepth 2 -maxdepth 2 -name '*.html' | wc -l)
          echo "Published textbook HTML root pages: $number"
          if [ "$number" -eq 0 ]; then
            echo "::error::No PreTeXt textbook HTML was produced; the published page is only a placeholder."
            exit 1
          fi

