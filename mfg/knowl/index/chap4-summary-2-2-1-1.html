<div class="para">If a quantity is multiplied by a constant factor, <span class="process-math">\(b\text{,}\)</span> in each time period, we say that it undergoes <dfn class="terminology">exponential growth</dfn> or <dfn class="terminology">decay</dfn> . The constant <span class="process-math">\(b\)</span> is called the <dfn class="terminology">growth factor</dfn> if <span class="process-math">\(b\gt 1\)</span> and the <dfn class="terminology">decay factor</dfn> if <span class="process-math">\(0 \lt b \lt 1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#chap4-summary-2-2-1-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
