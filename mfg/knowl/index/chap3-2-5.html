<h2 class="heading"><span class="type">Paragraph</span></h2>
<div class="para logical">
<div class="para">Kleiber modeled his data by the power function</div>
<div class="displaymath process-math">
\begin{equation*}
P(m) = 73.3m^{0.74}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(P\)</span> is the metabolic rate and <span class="process-math">\(m\)</span> is the mass of the animal.  Kleiber’s rule initiated the use of <dfn class="terminology">allometric equations</dfn>, or power functions of mass, in physiology.</div>
