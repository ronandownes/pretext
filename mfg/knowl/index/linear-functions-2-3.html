<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Slope-Intercept Form.</span></h2>
<div class="para logical">
<div class="para">If we write the equation of a linear function in the form,</div>
<div class="displaymath process-math">
\begin{equation*}
f (x) = b + mx
\end{equation*}
</div>
<div class="para">then <span class="process-math">\(m\)</span> is the <dfn class="terminology">slope</dfn> of the line, and <span class="process-math">\(b\)</span> is the <dfn class="terminology"><span class="process-math">\(y\)</span>-intercept</dfn>.</div>
