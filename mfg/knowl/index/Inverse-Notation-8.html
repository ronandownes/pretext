<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Inverse Functions.</span></h2>
<div class="para logical">
<div class="para">Suppose the inverse of <span class="process-math">\(f\)</span> is a function, denoted by <span class="process-math">\(f^{-1}\text{.}\)</span> Then</div>
<div class="displaymath process-math">
\begin{equation*}
f^{-1}(y) = x~~~~ \text{ if and only if }~~~~f(x) = y
\end{equation*}
</div>
