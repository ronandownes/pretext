<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Rational Function.</span></h2>
<div class="para logical">
<div class="para">A <dfn class="terminology">rational function</dfn> is one of the form</div>
<div class="displaymath process-math">
\begin{equation*}
f(x) =\frac{P(x)}{Q(x)}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(P(x)\)</span> and <span class="process-math">\(Q(x)\)</span> are polynomials and <span class="process-math">\(Q(x)\)</span> is not the zero polynomial.</div>
