<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Angles in a Unit Circle.</span></h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(P\)</span> be a point on a unit circle determined by the terminal side of an angle <span class="process-math">\(\theta\)</span> in standard position. Then the coordinates <span class="process-math">\((x,y)\)</span>  of <span class="process-math">\(P\)</span> are given by</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{x = \cos (\theta),~~~~~~y = \sin (\theta)}
\end{equation*}
</div>
