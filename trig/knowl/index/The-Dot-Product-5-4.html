<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Geometric Form for the Dot Product.</span></h2>
<div class="para logical">
<div class="para">The <dfn class="terminology">dot product</dfn> of two vectors <span class="process-math">\({\bf{v}}\)</span> and <span class="process-math">\({\bf{w}}\)</span> is the scalar</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{{\bf{v}} \cdot {\bf{w}} = \|{\bf{v}}\|\|{\bf{w}}\| \cos (\theta)}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(\theta\)</span> is the angle between the vectors.</div>
