<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Component of a Vector.</span></h2>
<div class="para logical">
<div class="para">The component of a vector <span class="process-math">\({\bf{F}}\)</span> in the direction of vector <span class="process-math">\({\bf{v}}\)</span> is</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{\text{comp}_{\bf{v}}{\bf{F}} = \|{\bf{F}}\| \cos (\theta)}
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(\theta\)</span> is the angle between <span class="process-math">\({\bf{F}}\)</span> and <span class="process-math">\({\bf{v}}\text{.}\)</span>
</div>
