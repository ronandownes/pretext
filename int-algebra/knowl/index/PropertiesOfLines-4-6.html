<div class="para">Another way to state the condition for perpendicular lines is</div>
<div class="displaymath process-math">
\begin{equation*}
m_2=\frac{-1}{m_1}
\end{equation*}
</div>
<div class="para">Because of this relationship, we often say that the slope of one perpendicular line is the <dfn class="terminology">negative reciprocal</dfn> of the other.</div>
