<div class="para logical">
<div class="para">The product of two factors equals zero if and only if one or both of the factors equals zero.  In symbols,</div>
<div class="displaymath process-math">
\begin{equation*}
ab = 0~~~\text{if and only if}~~~a=0~~~\text{or}~~~b=0~~~\text{(or both)}
\end{equation*}
</div>
