<div class="para logical">
<div class="displaymath process-math">
\begin{align*}
\sqrt[n]{a^n} \amp = a  \amp \amp   \text{If}~n~\text{is odd.}\\
\sqrt[n]{a^n} \amp = \abs{a}  \amp \amp   \text{If}~n~\text{is even.}
\end{align*}
