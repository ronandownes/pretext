<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Coordinate Formula for Slope.</span></h2>
<div class="para logical">
<div class="para">If <span class="process-math">\((x_1, y_1)\)</span> and <span class="process-math">\((x_2, y_2)\)</span> are two points on a line, then the slope of the line is given by</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{m = \frac{y_2 - y_1}{x_2 - x_1}} 
\end{equation*}
</div>
<div class="para">as long as <span class="process-math">\(x_1 \ne x_2\)</span>
</div>
