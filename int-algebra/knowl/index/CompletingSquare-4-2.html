<div class="para">We can use extraction of roots to solve equations of the form</div>
<div class="displaymath process-math">
\begin{equation*}
a(x + p)^2 + q = 0
\end{equation*}
</div>
<div class="para">where the left side of the equation includes the square of a binomial, or a <dfn class="terminology">perfect square</dfn>. It turns out that we can write any quadratic equation in this form.</div>
