</h2>
<div class="para logical">
<div class="para">The <dfn class="terminology">absolute value</dfn> of <span class="process-math">\(x\)</span> is defined by</div>
<div class="displaymath process-math">
\begin{align*}
\abs{x} =
\begin{cases}
x \amp \text{if } x\ge 0\\
-x  \amp \text{if } x\lt 0
\end{cases}
\end{align*}
</div>
