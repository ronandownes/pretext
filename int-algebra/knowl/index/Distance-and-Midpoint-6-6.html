<div class="para logical">
<div class="para">The equation for a <dfn class="terminology">circle</dfn> of radius <span class="process-math">\(r\)</span> centered at the point <span class="process-math">\((h,k)\)</span> is</div>

\blert{(x-h)^2+(y-k)^2=r^2}
\end{equation*}
