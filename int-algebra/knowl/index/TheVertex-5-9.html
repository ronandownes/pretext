<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Vertex Form for a Quadratic Equation.</span></h2>
<div class="para logical">
<div class="para">A quadratic equation <span class="process-math">\(~y=ax^2+bx+c,~a \not=0,~\)</span> can be written in the vertex form</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{y=a(x-x_v)^2+y_v}
\end{equation*}
</div>
<div class="para">where the vertex of the graph is <span class="process-math">\(~(x_v,y_v)\text{.}\)</span>
</div>
