<div class="para logical">
<div class="para">The <dfn class="terminology">natural logarithm</dfn> is the logarithm base <span class="process-math">\(e\text{.}\)</span>
</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{\ln {(x)} = \log_{e}{(x)}, ~~~~ x\gt 0}
\end{equation*}
