<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Central Hyperbola.</span></h2>
<div class="para logical">
<div class="para">The equation of a hyperbola with center at the origin is</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{\frac{x^2}{a^2} - \frac{y^2}{b^2} = 1} \qquad
\text{ or } \qquad \blert{\frac{y^2}{b^2} -\frac{x^2}{a^2}  = 1}
\end{equation*}
</div>
