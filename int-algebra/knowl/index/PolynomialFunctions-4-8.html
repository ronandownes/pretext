<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Degree of a Product.</span></h2>
<div class="para">The degree of a product of non-zero polynomials is the sum of the degrees of the factors.  That is:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#PolynomialFunctions-4-8-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">If <span class="process-math">\(P(x)\)</span> has degree <span class="process-math">\(m\)</span> and <span class="process-math">\(Q(x)\)</span> has degree <span class="process-math">\(n\text{,}\)</span> then their product <span class="process-math">\(P(x)Q(x)\)</span> has degree <span class="process-math">\(m+n\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#PolynomialFunctions-4-8-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
