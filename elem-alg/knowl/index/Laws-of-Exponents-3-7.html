<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Laws of Exponents.</span></h2>
<div class="para logical">
<div class="para">First Law of Exponents</div>
<div class="displaymath process-math">
\begin{gather*}
\blert{a^m \cdot a^n = a^{m+n}}
\end{gather*}
</div>
<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#Laws-of-Exponents-3-7-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para logical">
<div class="para">Second Law of Exponents</div>
<div class="displaymath process-math">
\begin{gather*}
\blert{\dfrac{a^m}{a^n} = a^{m-n}~~~~(n \lt m)}\\
\blert{\dfrac{a^m}{a^n} = \dfrac{1}{a^{n-m}}~~~~(n \gt m)}
\end{gather*}
</div>
