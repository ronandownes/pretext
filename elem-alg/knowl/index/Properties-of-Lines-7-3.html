<div class="para logical">
<div class="para">The slope of the line joining points <span class="process-math">\(P_1(x_1,y_1)\)</span> and <span class="process-math">\(P_2(x_2,y_2)\)</span> is</div>
<div class="displaymath process-math">
\begin{gather*}
\blert{m=\dfrac{y_2-y_1}{x_2-x_1}}~~~~~~\text{if}~~~~x_2 \not= x_1
\end{gather*}
</div>
