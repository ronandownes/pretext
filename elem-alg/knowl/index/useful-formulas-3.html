<div class="para">To find the distance traveled by an object moving at a constant speed or rate for a specified time, we multiply the rate by the time.</div>
<div class="displaymath process-math">

\blert{\text{distance} = \text{rate} \times \text{time}~~~~~~~~~~~~~d = rt}
\end{gather*}
